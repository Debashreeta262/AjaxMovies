<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register &mdash; Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand"><span class="mark">&#9679;</span> Meridian</a>
    <nav class="nav-links">
      <a href="login.html">Log in instead</a>
    </nav>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="sub">Registers you as an employee. An admin can grant you directory access later.</p>

    <div class="form-error" id="formError"></div>
    <div class="form-success" id="formSuccess"></div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Work email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="department">Department</label>
          <input type="text" id="department" name="department" placeholder="e.g. Engineering">
        </div>
        <div class="field">
          <label for="designation">Designation</label>
          <input type="text" id="designation" name="designation" placeholder="e.g. Analyst">
        </div>
      </div>
      <div class="field">
        <label for="phone">Phone <span style="opacity:.6">(optional)</span></label>
        <input type="tel" id="phone" name="phone" autocomplete="tel">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary submit-btn" id="submitBtn">
        <span class="spinner"></span>
        <span class="btn-label">Create account</span>
      </button>
    </form>

    <div class="switch">Already registered? <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/register.js"></script>
</body>
</html>
