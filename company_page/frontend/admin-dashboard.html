<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin dashboard &mdash; Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand"><span class="mark">&#9679;</span> Meridian</a>
    <nav class="nav-links">
      <span id="whoami" style="color:var(--paper-dim); font-size:0.9rem;"></span>
      <a href="#" class="btn btn-ghost btn-sm" id="logoutBtn">Log out</a>
    </nav>
  </div>
</header>

<main class="shell">
  <div class="dash-header">
    <div class="role-tag">Administrator</div>
    <h1 id="greeting">Welcome</h1>
    <p>Every account on the system, in full. Use the toggle to grant or revoke an employee's access to the shared directory.</p>

    <div class="card-grid" id="statCards" style="margin-top:28px;">
      <div class="skeleton-line" style="height:60px"></div>
      <div class="skeleton-line" style="height:60px"></div>
      <div class="skeleton-line" style="height:60px"></div>
    </div>
  </div>

  <section class="panel active" style="padding-top:36px;">
    <div class="table-wrap">
      <table class="data-table" id="employeeTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Department</th>
            <th>Designation</th>
            <th>Status</th>
            <th>Directory access</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="employeeTableBody">
          <tr><td colspan="8"><div class="skeleton-line"></div></td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
