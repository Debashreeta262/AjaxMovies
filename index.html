<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search for movie details with the OMDb API.">
    <title>Movie Finder | Movie Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <header class="site-header">
            <p class="eyebrow">YOUR PERSONAL SCREEN GUIDE</p>
            <h1>Movie Finder</h1>
            <p class="subtitle">Search for any movie and discover its details.</p>
        </header>

        <section class="search-panel" aria-labelledby="search-heading">
            <h2 id="search-heading">Find your next favorite</h2>
            <form id="search-form" class="search-form">
                <label class="sr-only" for="movie-input">Movie name</label>
                <div class="search-controls">
                    <input id="movie-input" name="movie" type="search" placeholder="Enter movie name..." autocomplete="off" required>
                    <button type="submit" id="search-button">Search</button>
                </div>
            </form>
        </section>

        <section id="movie-details" class="movie-details" aria-live="polite" aria-busy="false">
            <div class="empty-state">
                <span class="empty-icon" aria-hidden="true">&#127909;</span>
                <p>Search for a movie to see its details.</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Movie data provided by OMDb API</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
